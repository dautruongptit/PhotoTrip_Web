server {
    listen 80; # Hoặc port 8081 tùy cấu hình Nginx của bạn
    server_name triptravel.thongtinchinhhieu.site;

    # 1. Để Frontend (React) tự handle các route giao diện (kể cả /oauth2/callback)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html; 
    }

    # 2. CHỈ Proxy sang Backend (8068) khi đường dẫn bắt đầu bằng /api hoặc /oauth2/authorization
    location /api/ {
        proxy_pass http://travelPhoto-backend:8068/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy riêng cho luồng login Google của Spring Security
    location /oauth2/authorization/ {
        proxy_pass http://travelPhoto-backend:8068/oauth2/authorization/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login/oauth2/code/ {
        proxy_pass http://travelPhoto-backend:8068/login/oauth2/code/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}